<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points Table & NRR Standings - CITPL 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Top Bar -->
    <div class="top-bar d-none d-lg-block">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">
            <div class="d-flex align-items-center gap-2">
                <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='../index.html'" class="btn btn-sm btn-outline-light rounded-pill px-3 fw-bold me-2">
                    <i class="fas fa-arrow-left me-1"></i> Back
                </button>
                <span><i class="fas fa-phone"></i> 9887464209 &nbsp;&nbsp; <i class="fas fa-envelope"></i> citpl@cit.ac.in</span>
            </div>
            <div><a href="../index.html">Home</a></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-2 sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img src="../assets/citpl-logo.jpg" alt="CITPL Logo" class="cit-logo">
                <div>
                    <div class="institute-title">सीआईटी प्रीमियर लीग 2026</div>
                    <div class="institute-subtitle">Official Points Table & Standings</div>
                </div>
            </a>
            <div class="ms-auto">
                <a href="matches.html" class="btn btn-outline-primary btn-sm rounded-pill fw-bold"><i class="fas fa-calendar-alt me-1"></i> Matches</a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="bg-primary text-white py-4">
        <div class="container px-4 text-center">
            <h2 class="fw-bold mb-1"><i class="fas fa-table me-2"></i> CITPL 2026 Points Standings</h2>
            <p class="mb-0 text-light">Win = 2 Points • Tie = 1 Point • NRR Auto Calculated</p>
        </div>
    </div>

    <!-- Points Table -->
    <div class="container py-5">
        <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table custom-table align-middle mb-0 text-center">
                        <thead>
                            <tr>
                                <th class="text-start">POS</th>
                                <th class="text-start">TEAM</th>
                                <th>MATCHES</th>
                                <th>WON</th>
                                <th>LOST</th>
                                <th>POINTS</th>
                                <th>NRR</th>
                            </tr>
                        </thead>
                        <tbody id="pointsTableBody">
                            <!-- Loaded dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/firebase-config.js"></script>
    <script>
        function renderPointsTable() {
            const teams = window.citplDB.db.teams;
            teams.sort((a, b) => b.points - a.points);
            const body = document.getElementById("pointsTableBody");

            body.innerHTML = teams.map((t, idx) => `
                <tr class="${idx === 0 ? 'table-warning fw-bold' : ''}">
                    <td class="text-start fw-bold fs-5">${idx + 1}</td>
                    <td class="text-start">
                        <div class="d-flex align-items-center gap-3">
                            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold small" style="width: 35px; height: 35px;">${t.shortName}</div>
                            <strong class="text-dark">${t.name}</strong>
                        </div>
                    </td>
                    <td>${t.wins + t.losses}</td>
                    <td class="text-success fw-bold">${t.wins}</td>
                    <td class="text-danger">${t.losses}</td>
                    <td><span class="badge bg-primary fs-6 px-3 py-1 rounded-pill">${t.points} Pts</span></td>
                    <td class="fw-bold text-info">${t.nrr}</td>
                </tr>
            `).join('');
        }

        renderPointsTable();
    </script>
</body>

</html>
